<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recos Cardio">
<title>Recos Cardio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} [hidden]{display:none!important}
/* Mise en page : barre du haut collante, une colonne de lecture (≤ 720 px),
   onglets de chapitres collants, barre d’onglets fixe en bas (Recos · Entraînement · Recherche · Outils). */
:root{
  --paper:#F5F6F8; --sheet:#FFFFFF; --ink:#141D26; --muted:#5A6774; --line:#E0E4E9; --soft:#ECEFF3;
  --accent:#0F5E8C; --accent-bg:#E6F0F6;
  --d-ic:#B71C3A; --d-ry:#3446B0; --d-co:#A4511A; --d-va:#0D7470; --d-pr:#3C7A2A; --d-vx:#7A3E9A; --d-sp:#4A6378;
  --d-ic-bg:#FBEDF0; --d-ry-bg:#EDEFFB; --d-co-bg:#FAEFE6; --d-va-bg:#E6F4F3; --d-pr-bg:#EDF5E9; --d-vx-bg:#F4ECF8; --d-sp-bg:#EBF0F4;
  --cI:#1E7B3C; --cIIa:#9A7400; --cIIb:#C0580A; --cIII:#B3261E;
  --cI-bg:#E5F3E9; --cIIa-bg:#FBF3D9; --cIIb-bg:#FCEBDD; --cIII-bg:#FBE6E4;
  --warn:#9A3B00; --warn-bg:#FFF3EA; --upd:#2F5D2F; --upd-bg:#EDF6EB; --prat:#0F5E8C; --prat-bg:#E6F0F6;
  --good:#1E7B3C; --good-bg:#E5F3E9; --bad:#B3261E; --bad-bg:#FBE6E4; --miss:#9A7400; --miss-bg:#FBF3D9;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --fs:16px; --bar:52px; --tabs:46px; --nav:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E141A; --sheet:#151D25; --ink:#E6EBF0; --muted:#9AA7B3; --line:#25303B; --soft:#1B252F;
  --accent:#5DB3E6; --accent-bg:#122636;
  --d-ic:#F0607A; --d-ry:#8C9BFF; --d-co:#F09A5A; --d-va:#3FC2BA; --d-pr:#8BCB72; --d-vx:#C88BE6; --d-sp:#9FB6C8;
  --d-ic-bg:#2A161C; --d-ry-bg:#191D36; --d-co-bg:#2B1D12; --d-va-bg:#10292A; --d-pr-bg:#15241A; --d-vx-bg:#24182B; --d-sp-bg:#18212A;
  --cI:#6CCB8A; --cIIa:#E8C24A; --cIIb:#F29A5A; --cIII:#F27A70;
  --cI-bg:#132A1C; --cIIa-bg:#2A2410; --cIIb-bg:#2C1C10; --cIII-bg:#2E1513;
  --warn:#FFB07A; --warn-bg:#2A1C12; --upd:#9AD49A; --upd-bg:#14241A; --prat:#5DB3E6; --prat-bg:#122636;
  --good:#6CCB8A; --good-bg:#132A1C; --bad:#F27A70; --bad-bg:#2E1513; --miss:#E8C24A; --miss-bg:#2A2410;
  color-scheme:dark;
}}
html[data-size="1"]{--fs:17.5px} html[data-size="2"]{--fs:19px}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:var(--fs); line-height:1.6;
  -webkit-text-size-adjust:100%; padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 24px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit}
.col{max-width:720px; margin-inline:auto; padding-inline:16px}
b,strong{font-weight:600}

/* ---------- barre du haut ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; height:var(--bar);
  background:color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter:saturate(1.4) blur(12px);
  -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line)}
.bar .col{height:100%; display:flex; align-items:center; gap:8px}
.brand{font-family:var(--display); font-size:1.4rem; text-decoration:none; white-space:nowrap}
.brand i{color:var(--accent)}
.bar-title{flex:1; min-width:0; font-weight:600; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; min-width:40px; height:40px; padding:0 8px;
  border:0; background:none; border-radius:10px; cursor:pointer; color:var(--accent); text-decoration:none; font-weight:500}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.sizebtn{margin-left:auto; color:var(--muted); font-family:var(--display); font-size:1.25rem}

/* ---------- barre d’onglets du bas ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; display:grid; grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb, var(--sheet) 94%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; text-decoration:none; color:var(--muted);
  font-size:.7rem; font-weight:500; border-radius:10px; position:relative}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.tabbar .dot{position:absolute; top:3px; left:calc(50% + 8px); min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--d-ic); color:#fff; font-size:.62rem; line-height:16px; text-align:center}

/* ---------- listes ---------- */
.head{padding-block:22px 6px}
.head h1{font-family:var(--display); font-weight:400; font-size:2.3rem; line-height:1.05; margin:0; text-wrap:balance}
.head p{margin:.5rem 0 0; color:var(--muted); font-size:.95rem}
.card-link{display:flex; align-items:center; gap:12px; margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--sheet);
  border:1px solid var(--line); text-decoration:none}
.card-link small{display:block; color:var(--muted); font-size:.8rem}
.card-link strong{display:block; font-weight:600; line-height:1.3}
.card-link .go{margin-left:auto; color:var(--accent); font-size:1.2rem}
.card-link.due{background:var(--accent-bg); border-color:transparent}
.card-link.due strong{color:var(--accent)}
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-inline:-16px; padding:14px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap; overflow:visible; margin-inline:0; padding:6px 0 0}
.chip{flex:0 0 auto; border:1px solid var(--line); background:var(--sheet); color:var(--ink); border-radius:999px; padding:.42rem .85rem;
  font-size:.86rem; cursor:pointer; white-space:nowrap; text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.chip small{opacity:.7; margin-left:4px}
.group h2, .sect{font-family:var(--display); font-weight:400; font-size:1.45rem; margin:22px 0 8px; display:flex; align-items:center; gap:10px}
.group h2::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--gc)}
.rows{list-style:none; margin:0; padding:0; background:var(--sheet); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.rows li + li{border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:4px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px 12px 0; text-decoration:none}
.row::before{content:""; align-self:stretch; background:var(--gc, var(--accent)); border-radius:0 3px 3px 0}
.row strong{display:block; font-weight:600; line-height:1.3}
.row .sub{display:block; color:var(--muted); font-size:.84rem; line-height:1.4; margin-top:2px}
.row .chev{color:var(--muted); font-size:1.2rem}
.row:active{background:var(--soft)}
.row.soon{opacity:.55}
.row.soon::before{background:var(--line)}
.row .yr{font:500 .8rem var(--mono); color:var(--muted)}
.prog{height:4px; border-radius:2px; background:var(--soft); overflow:hidden; margin-top:6px}
.prog i{display:block; height:100%; background:var(--gc, var(--accent)); border-radius:2px}
.note{color:var(--muted); font-size:.82rem; margin-top:28px; line-height:1.5}
.textbtn{border:0; background:none; color:var(--accent); padding:8px 0; cursor:pointer; font-size:.9rem}

/* ---------- lecture d’une recommandation ---------- */
.d-top{padding-block:18px 8px}
.d-eye{font-size:.84rem; color:var(--fc); font-weight:600}
.d-top h2{font-family:var(--display); font-weight:400; font-size:clamp(1.9rem, 7vw, 2.5rem); line-height:1.08; margin:.15rem 0 .35rem; text-wrap:balance}
.d-meta{font-size:.82rem; color:var(--muted); margin:0}
.d-meta a{color:var(--fc)}
.d-tools{display:flex; gap:8px; flex-wrap:wrap; padding-top:10px}
.d-tools .chip{font-size:.82rem; padding:.36rem .75rem}
.ptabs{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--bar)); z-index:20; background:color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.ptabs .col{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; height:var(--tabs); align-items:stretch}
.ptabs .col::-webkit-scrollbar{display:none}
.ptab{flex:0 0 auto; border:0; background:none; padding:0 12px; font-size:.92rem; color:var(--muted); cursor:pointer; position:relative; white-space:nowrap}
.ptab[aria-selected="true"]{color:var(--ink); font-weight:600}
.ptab[aria-selected="true"]::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--fc)}
.pane{padding-block:20px 8px; animation:paneIn .18s ease-out}
@keyframes paneIn{from{opacity:.4; transform:translateY(4px)} to{opacity:1; transform:none}}
.pane > * + *{margin-top:14px}
.pane h3{font-family:var(--display); font-weight:400; font-size:1.5rem; line-height:1.15; margin:26px 0 0; text-wrap:balance}
.pane > h3:first-child{margin-top:0}
.pane h4{font-size:.95rem; font-weight:600; margin:18px 0 0; color:var(--fc)}
.pane p{margin:0}
.pane ul, .pane ol{margin:0; padding-left:1.2rem; display:grid; gap:.45rem}
.pane li::marker{color:var(--fc)}
.num{font-family:var(--mono); font-size:.9em; white-space:nowrap; background:var(--fcb, var(--soft)); padding:0 .3em; border-radius:4px}
.s30{background:var(--fcb); border-radius:14px; padding:16px 18px}
.s30 h3, .box h3, .blk-algo h3{margin:0 0 .5rem!important; font-family:var(--display); font-weight:400; font-size:1.3rem}
.s30 h3{color:var(--fc)}
.s30 ul, .box ul{margin:0; padding-left:1.15rem; display:grid; gap:.5rem}
.s30 > * + *, .box > * + *{margin-top:.5rem}
.box{border-radius:14px; padding:16px 18px}
.box.warn{background:var(--warn-bg)} .box.warn h3{color:var(--warn)}
.box.upd{background:var(--upd-bg)} .box.upd h3{color:var(--upd)}
.box.prat{background:var(--prat-bg)} .box.prat h3{color:var(--prat)}
.flow{display:grid; gap:8px}
.flow .st{background:var(--sheet); border:1px solid var(--line); border-left:4px solid var(--fc); border-radius:10px; padding:10px 12px; font-size:.95rem}
.flow .st b{display:block; color:var(--fc); font-size:.9rem}
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--sheet)}
table{border-collapse:collapse; width:100%; font-size:.88rem}
.tbl table{min-width:440px}
th,td{text-align:left; padding:.55rem .7rem; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600; font-size:.8rem; color:var(--muted); background:var(--soft)}
details{border:1px solid var(--line); border-radius:12px; background:var(--sheet)}
summary{cursor:pointer; list-style:none; padding:13px 44px 13px 16px; font-weight:600; position:relative; line-height:1.4}
summary::-webkit-details-marker{display:none}
summary::after{content:""; position:absolute; right:18px; top:19px; width:9px; height:9px; border-right:2px solid var(--fc); border-bottom:2px solid var(--fc); transform:rotate(45deg); transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg); top:23px}
details > div{padding:0 16px 14px} details > div > * + *{margin-top:.6rem}
.xref{display:flex; justify-content:space-between; gap:12px; align-items:center; padding:11px 14px; border-radius:12px; background:var(--sheet);
  border:1px solid var(--line); text-decoration:none; font-size:.94rem; font-weight:500}
.xref::after{content:"→"; color:var(--fc)}
.xref.ext::after{content:"↗"}
.xref.soon{color:var(--muted); font-weight:400}
.xref.soon::after{content:""}
.pane a:not(.xref):not(.chip){color:var(--fc)}

/* recommandations et classes */
.recos{display:grid; gap:6px}
.reco{display:grid; grid-template-columns:48px minmax(0,1fr); gap:12px; align-items:start; padding:10px 12px 10px 10px; border-radius:12px;
  background:var(--sheet); border:1px solid var(--line); border-left:4px solid var(--cc)}
.reco p{margin:0; line-height:1.5}
.reco .cls{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; width:48px; min-height:44px; border:0; border-radius:9px;
  background:var(--ccb); color:var(--cc); font:600 1rem/1.05 var(--mono); cursor:pointer; padding:4px 0}
.reco .cls small{font:500 .72rem var(--mono); opacity:.85}
.c-I{--cc:var(--cI); --ccb:var(--cI-bg)} .c-IIa{--cc:var(--cIIa); --ccb:var(--cIIa-bg)}
.c-IIb{--cc:var(--cIIb); --ccb:var(--cIIb-bg)} .c-III{--cc:var(--cIII); --ccb:var(--cIII-bg)}
.revise .reco:not(.show){border-left-color:var(--line)}
.revise .reco:not(.show) .cls{background:var(--soft); color:transparent; position:relative}
.revise .reco:not(.show) .cls small{color:transparent}
.revise .reco:not(.show) .cls::after{content:"?"; position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font:500 1.2rem var(--display)}
.only13 .reco.c-IIa, .only13 .reco.c-IIb{display:none}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--fc)} 100%{box-shadow:0 0 0 0 transparent}}
.legend{display:flex; flex-wrap:wrap; gap:6px; font-size:.78rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:10px; height:10px; border-radius:3px; background:var(--cc)}
.train-cta{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; border-radius:14px; background:var(--fcb); text-decoration:none; font-weight:600; color:var(--fc); border:0; width:100%; cursor:pointer; text-align:left}
.pager{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-block:18px 6px}
.pager a{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border-radius:12px; background:var(--sheet); border:1px solid var(--line);
  text-decoration:none; min-height:62px; justify-content:center}
.pager a small{color:var(--muted); font-size:.78rem}
.pager a strong{font-weight:600; color:var(--fc); line-height:1.3}
.pager .next{text-align:right; grid-column:2}
.toast{position:fixed; left:12px; right:12px; bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 12px); z-index:60; max-width:520px; margin-inline:auto;
  background:var(--ink); color:var(--sheet); padding:12px 14px; border-radius:12px; font-size:.9rem; line-height:1.45; box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast b{display:block}

/* ---------- recherche ---------- */
.s-field{display:flex; align-items:center; gap:8px; background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:0 12px; margin-top:16px}
.s-field svg{width:20px; height:20px; fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round}
.s-field input{flex:1; min-width:0; border:0; background:none; color:var(--ink); font:inherit; padding:13px 0; outline:none}
.s-count{color:var(--muted); font-size:.85rem; margin:12px 0 8px}
.hits{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.hitcard{background:var(--sheet); border:1px solid var(--line); border-left:4px solid var(--fc); border-radius:12px; padding:12px 14px 6px}
.hit-t{display:block; font-weight:600; line-height:1.3; margin-bottom:4px}
.hit{display:block; padding:8px 0; text-decoration:none; border-top:1px solid var(--line)}
.hit small{color:var(--fc); font-size:.8rem; font-weight:600}
.hit p{margin:4px 0 0; font-size:.88rem; color:var(--muted); line-height:1.45}
.hit mark{background:var(--warn-bg); color:var(--ink); border-radius:3px; padding:0 2px}
.hit-more{display:block; font-size:.8rem; color:var(--muted); padding:4px 0 8px}

/* ---------- entraînement ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px}
.stat{background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center}
.stat strong{display:block; font:500 1.35rem/1.2 var(--mono)}
.stat span{font-size:.72rem; color:var(--muted); line-height:1.2; display:block}
.builder{background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:16px; display:grid; gap:14px}
.builder h3{margin:0; font-size:.86rem; color:var(--muted); font-weight:600}
.builder .chips{padding-top:6px}
.bigbtn{display:block; width:100%; border:0; border-radius:12px; padding:.9rem; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:1rem}
.bigbtn[disabled]{opacity:.45; cursor:default}
.bigbtn.ghost{background:var(--soft); color:var(--ink)}
.q-prog{display:flex; align-items:center; gap:10px; padding-top:14px; font-size:.85rem; color:var(--muted)}
.q-prog .prog{flex:1; margin:0}
.q-prog button{border:0; background:none; color:var(--accent); cursor:pointer; font-size:.85rem; padding:6px 0}
.q-card{margin-top:12px}
.q-meta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:.8rem; color:var(--muted)}
.kb{display:inline-block; padding:.12rem .5rem; border-radius:6px; font-weight:600; font-size:.74rem; background:var(--accent-bg); color:var(--accent)}
.kb.dp{background:var(--d-vx-bg); color:var(--d-vx)} .kb.kfp{background:var(--d-co-bg); color:var(--d-co)}
.q-title{font-family:var(--display); font-weight:400; font-size:1.6rem; line-height:1.15; margin:.35rem 0 .2rem; text-wrap:balance}
.q-vig{background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:10px}
.q-vig p{margin:0} .q-vig > * + *{margin-top:.5rem}
.q-step{border-left:3px solid var(--accent); padding:4px 0 4px 12px; margin-top:18px}
.q-step b{display:block; font-size:.78rem; color:var(--accent); text-transform:uppercase; letter-spacing:.04em}
.q-step p{margin:.2rem 0 0}
.qq{margin-top:16px}
.qq-h{font-size:.78rem; color:var(--muted); font-weight:600; margin:0}
.qq-q{font-weight:600; margin:.2rem 0 .6rem; line-height:1.45}
.opts{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.opt{display:flex; gap:.7rem; align-items:flex-start; padding:.7rem .8rem; border-radius:11px; background:var(--sheet); border:1px solid var(--line); cursor:pointer; line-height:1.4}
.opt input{margin-top:.2rem; width:1.15rem; height:1.15rem; accent-color:var(--accent); flex:0 0 auto}
.opt:has(input:checked){border-color:var(--accent); background:var(--accent-bg)}
.opt .ot{flex:1; min-width:0}
.opt .why{display:block; font-size:.86rem; color:var(--muted); margin-top:.3rem}
.opt .tag{display:inline-block; font-size:.7rem; font-weight:700; padding:.05rem .4rem; border-radius:5px; margin-right:6px; vertical-align:1px}
.done .opt{cursor:default}
.opt.good{border-color:var(--good); background:var(--good-bg)}
.opt.bad{border-color:var(--bad); background:var(--bad-bg)}
.opt.miss{border-color:var(--miss); background:var(--miss-bg)}
.opt.good .tag{background:var(--good); color:var(--sheet)} .opt.bad .tag{background:var(--bad); color:var(--sheet)} .opt.miss .tag{background:var(--miss); color:var(--sheet)}
.opt.neutral{opacity:.75}
.kill{color:var(--bad); font-weight:600}
.qq-sc{display:flex; align-items:baseline; gap:8px; margin-top:10px; font-size:.9rem}
.qq-sc strong{font:500 1.1rem var(--mono)}
.qq-e{background:var(--prat-bg); border-radius:12px; padding:12px 14px; margin-top:8px; font-size:.94rem}
.qq-e b{color:var(--prat)}
.q-actions{position:sticky; bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px); padding-top:14px; z-index:5}
.q-actions .bigbtn{box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.q-hint{font-size:.82rem; color:var(--muted); margin:.4rem 0 0}
.endsc{text-align:center; padding:24px 0 8px}
.endsc strong{display:block; font:500 3rem/1 var(--mono); color:var(--accent)}
.endsc span{color:var(--muted)}
.res-list{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:6px}
.res-list li{display:grid; grid-template-columns:52px minmax(0,1fr); gap:10px; align-items:center; background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.res-list b{font:500 .95rem var(--mono); text-align:center; border-radius:8px; padding:4px 0}
.res-list .hi{background:var(--good-bg); color:var(--good)} .res-list .mid{background:var(--miss-bg); color:var(--miss)} .res-list .lo{background:var(--bad-bg); color:var(--bad)}
.res-list a{font-size:.82rem; color:var(--accent)}

/* ---------- calculateurs ---------- */
.calc{border:1px solid var(--line); border-radius:14px; background:var(--sheet); padding:16px; display:grid; gap:12px}
.c-head{font-family:var(--display); font-size:1.3rem; line-height:1.2; color:var(--fc, var(--accent))}
.c-form{display:grid; gap:12px; margin:0}
.c-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px}
.c-f{display:grid; gap:4px; font-size:.86rem; color:var(--muted); min-width:0; align-content:end}
.c-in{display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; background:var(--paper); overflow:hidden}
.c-in input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:500 1.1rem var(--mono); padding:.6rem .7rem}
.c-in em{font-size:.8rem; color:var(--muted); padding-right:.7rem; font-style:normal; white-space:nowrap}
.c-f select{font:inherit; font-size:.95rem; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:.55rem}
.c-r{border:0; margin:0; padding:0; display:grid; gap:6px; min-width:0}
.c-r legend{font-size:.86rem; color:var(--muted); margin-bottom:6px; padding:0}
.c-r label, .c-c{display:flex; gap:.7rem; align-items:flex-start; padding:.6rem .75rem; border-radius:10px; background:var(--paper); border:1px solid var(--line); font-size:.93rem; cursor:pointer; line-height:1.4}
.c-r label:has(input:checked), .c-c:has(input:checked){border-color:var(--fc, var(--accent)); background:var(--fcb, var(--accent-bg))}
.c-r label span, .c-c span{flex:1}
.c-r b, .c-c b{font:500 .85rem var(--mono); color:var(--muted)}
.c-r input, .c-c input{margin-top:.2rem; accent-color:var(--accent); width:1.1rem; height:1.1rem; flex:0 0 auto}
.c-list{display:grid; gap:6px}
.calc input, .calc select{scroll-margin-bottom:200px}
.c-more{margin-top:-4px}
.c-sub{font-size:.8rem; font-weight:600; color:var(--muted); margin:6px 0 -4px; text-transform:uppercase; letter-spacing:.04em}
.c-res{position:sticky; bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px); z-index:5}
.c-out{border-radius:12px; padding:12px 14px; background:var(--soft); display:grid; gap:2px; box-shadow:0 8px 22px -12px rgba(0,0,0,.45)}
.c-out strong{font:500 1.45rem/1.2 var(--mono)} .c-out strong small{font:400 .8rem var(--body); color:var(--muted)}
.c-out span{font-size:.92rem; line-height:1.45}
.c-out.lo{background:var(--upd-bg)} .c-out.lo strong{color:var(--upd)}
.c-out.mid{background:var(--warn-bg)} .c-out.mid strong{color:var(--warn)}
.c-out.hi{background:var(--bad-bg)} .c-out.hi strong{color:var(--bad)}
.c-n{font-size:.84rem; color:var(--muted); margin:.5rem 0 0; line-height:1.45} .c-n.warn{color:var(--warn)}
.c-t{width:100%; font-size:.88rem; margin-top:.5rem; background:var(--sheet); border:1px solid var(--line); border-radius:10px; border-collapse:separate; border-spacing:0; overflow:hidden}
.c-t td{padding:.45rem .6rem; border-bottom:1px solid var(--line)} .c-t tr:last-child td{border-bottom:0}
.c-t td:first-child{font-weight:600} .c-t td + td{font-family:var(--mono); font-size:.85rem}
.c-link{display:inline-block; color:var(--accent); font-weight:600}
.used{margin-top:16px}
.used h3{font-size:.86rem; color:var(--muted); font-weight:600; margin:0 0 8px}
.used .chips{padding-top:0}

/* ---------- verrou ---------- */
.lock{position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:24px; background:var(--paper)}
.lock-card{width:100%; max-width:360px; display:grid; gap:12px; text-align:center}
.lock-card img{justify-self:center; border-radius:18px}
.lock-card h1{font-family:var(--display); font-weight:400; font-size:2rem; margin:0}
.lock-card p{margin:0; color:var(--muted); font-size:.95rem}
.lock-l{text-align:left; font-size:.86rem; color:var(--muted); margin-top:8px}
.lock-card input[type=password]{font:inherit; font-size:1.05rem; padding:.8rem .9rem; border:1px solid var(--line); border-radius:12px; background:var(--sheet); color:var(--ink)}
.lock-card button{font:inherit; font-weight:600; padding:.85rem; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer}
.lock-card button[disabled]{opacity:.6}
.lock-err{color:var(--bad)!important}
body.locked .bar, body.locked .tabbar{display:none}
</style>

<script>
/* ===================================================================
   Calculateurs. Chaque calculateur se rend dans <div class="calc" data-calc="id">,
   recalcule à chaque saisie et ne conserve rien.
   =================================================================== */
(function () {
  var uid = 0;
  function n(v) { var x = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(x) ? null : x; }
  function fmt(x, d) { return x.toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function num(p, id, label, unit, attrs) {
    return '<label class="c-f" for="' + p + id + '"><span>' + label + '</span><span class="c-in"><input id="' + p + id +
      '" data-k="' + id + '" type="number" inputmode="decimal" step="any" ' + (attrs || '') + '>' +
      (unit ? '<em>' + unit + '</em>' : '') + '</span></label>';
  }
  function chk(p, id, label, pts) {
    return '<label class="c-c" for="' + p + id + '"><input id="' + p + id + '" data-k="' + id + '" type="checkbox"><span>' + label +
      '</span>' + (pts !== undefined ? '<b>' + String(pts).replace('.', ',') + '</b>' : '') + '</label>';
  }
  function radio(p, id, legend, opts) {
    return '<fieldset class="c-r"><legend>' + legend + '</legend>' + opts.map(function (o, i) {
      return '<label for="' + p + id + i + '"><input id="' + p + id + i + '" type="radio" name="' + p + id + '" data-k="' + id + '" value="' + o[0] + '"' +
        (i === 0 ? ' checked' : '') + '><span>' + o[1] + '</span>' + (o[2] !== undefined ? '<b>' + String(o[2]).replace('.', ',') + '</b>' : '') + '</label>';
    }).join('') + '</fieldset>';
  }
  function sub(t) { return '<p class="c-sub">' + t + '</p>'; }
  function vals(root) {
    var v = {};
    root.querySelectorAll('[data-k]').forEach(function (el) {
      var k = el.dataset.k;
      if (el.type === 'checkbox') v[k] = el.checked;
      else if (el.type === 'radio') { if (el.checked) v[k] = el.value; }
      else v[k] = el.value;
    });
    return v;
  }
  function out(level, big, text) { return '<div class="c-out ' + (level || '') + '"><strong>' + big + '</strong><span>' + text + '</span></div>'; }
  function tbl(rows) { return '<table class="c-t">' + rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>'; }
  function sexe(p) { return radio(p, 'sexe', 'Sexe', [['h', 'Homme'], ['f', 'Femme']]); }
  function cg(age, poids, cr, sx) { return (140 - age) * poids * (sx === 'f' ? 1.04 : 1.23) / cr; }
  function ckdepi(age, cr, sx) {
    var s = cr / 88.4, k = sx === 'f' ? 0.7 : 0.9, a = sx === 'f' ? -0.241 : -0.302;
    return 142 * Math.pow(Math.min(s / k, 1), a) * Math.pow(Math.max(s / k, 1), -1.2) * Math.pow(0.9938, age) * (sx === 'f' ? 1.012 : 1);
  }
  function renalInputs(p) {
    return '<div class="c-grid">' + num(p, 'age', 'Âge', 'ans', 'min="18" max="110"') + num(p, 'poids', 'Poids', 'kg', 'min="20" max="250"') +
      num(p, 'cr', 'Créatinine', 'µmol/L', 'min="20" max="1500"') + '</div>' + sexe(p);
  }

  var C = {};

  C.cha2ds2va = {
    title: 'Score CHA₂DS₂-VA (fibrillation atriale, 2024)',
    form: function (p) {
      return '<div class="c-list">' + chk(p, 'c', 'Insuffisance cardiaque (symptomatique quelle que soit la fraction d’éjection, ou fraction d’éjection ≤ 40 %)', 1) +
        chk(p, 'h', 'Hypertension artérielle (traitée ou pression ≥ 140/90 mmHg à plusieurs reprises)', 1) + '</div>' +
        radio(p, 'a', 'Âge', [['0', 'Moins de 65 ans', 0], ['1', '65 à 74 ans', 1], ['2', '75 ans ou plus', 2]]) +
        '<div class="c-list">' + chk(p, 'd', 'Diabète', 1) + chk(p, 's', 'AVC, accident ischémique transitoire ou embolie artérielle', 2) +
        chk(p, 'v', 'Maladie vasculaire (infarctus, coronaropathie, artériopathie périphérique, plaque aortique)', 1) + '</div>';
    },
    calc: function (v) {
      var s = (v.c ? 1 : 0) + (v.h ? 1 : 0) + (+v.a || 0) + (v.d ? 1 : 0) + (v.s ? 2 : 0) + (v.v ? 1 : 0);
      var r = s >= 2 ? ['hi', 'Anticoagulation orale recommandée (classe I C). Anticoagulant oral direct de préférence (I A).']
        : s === 1 ? ['mid', 'Anticoagulation orale à envisager (classe IIa C), en décision partagée.']
          : ['lo', 'Pas d’anticoagulation pour prévenir l’AVC sur ce seul score.'];
      return out(r[0], s + ' <small>point' + (s > 1 ? 's' : '') + '</small>', r[1]) +
        '<p class="c-n">Le sexe féminin n’est plus compté. Anticoagulation quel que soit le score en cas de cardiomyopathie hypertrophique, d’amylose cardiaque, de valve mécanique (antivitamine K) ou de rétrécissement mitral significatif (antivitamine K). Réévaluer le score régulièrement.</p>';
    }
  };

  C.hasbled = {
    title: 'Score HAS-BLED (risque hémorragique sous anticoagulant)',
    form: function (p) {
      return '<div class="c-list">' + chk(p, 'h', 'Hypertension non contrôlée (systolique > 160 mmHg)', 1) +
        chk(p, 'r', 'Insuffisance rénale sévère (dialyse, greffe, créatinine > 200 µmol/L)', 1) +
        chk(p, 'f', 'Hépatopathie (cirrhose, ou bilirubine > 2 fois et transaminases > 3 fois la normale)', 1) +
        chk(p, 's', 'Antécédent d’AVC', 1) + chk(p, 'b', 'Saignement majeur ou prédisposition (anémie, thrombopénie)', 1) +
        chk(p, 'l', 'INR instable (sous antivitamine K, temps dans la zone < 60 %)', 1) + chk(p, 'e', 'Âge > 65 ans', 1) +
        chk(p, 'm', 'Antiplaquettaire ou anti-inflammatoire non stéroïdien', 1) + chk(p, 'al', 'Alcool (≥ 8 verres par semaine)', 1) + '</div>';
    },
    calc: function (v) {
      var s = ['h', 'r', 'f', 's', 'b', 'l', 'e', 'm', 'al'].reduce(function (a, k) { return a + (v[k] ? 1 : 0); }, 0);
      var hi = s >= 3;
      return out(hi ? 'hi' : 'lo', s + ' <small>point' + (s > 1 ? 's' : '') + '</small>', hi ? 'Risque hémorragique élevé : corriger les facteurs modifiables (pression artérielle, antiplaquettaire inutile, alcool, INR) et revoir le patient plus souvent.' : 'Risque hémorragique non élevé.') +
        '<p class="c-n warn">Un score hémorragique ne doit pas servir à refuser ou arrêter l’anticoagulation (classe III B). Il sert à repérer les facteurs modifiables (I B).</p>';
    }
  };

  C.aod = {
    title: 'Dose des anticoagulants oraux directs (fibrillation atriale)',
    form: function (p) {
      return renalInputs(p) + '<div class="c-list">' + chk(p, 'vera', 'Vérapamil') +
        chk(p, 'pgp', 'Ciclosporine, dronédarone, érythromycine ou kétoconazole') + '</div>';
    },
    calc: function (v) {
      var age = n(v.age), w = n(v.poids), cr = n(v.cr);
      if (age === null || w === null || cr === null) return out('', '—', 'Renseignez âge, poids, créatinine et sexe. La clairance est calculée par Cockcroft-Gault avec le poids réel.');
      var cl = cg(age, w, cr, v.sexe), rows = [], lvl = 'lo';
      if (cl < 15) return out('hi', fmt(cl) + ' <small>mL/min</small>', 'Clairance < 15 mL/min : anticoagulants oraux directs non recommandés. Antivitamine K ou avis spécialisé.');
      // apixaban
      var crit = (age >= 80 ? 1 : 0) + (w <= 60 ? 1 : 0) + (cr >= 133 ? 1 : 0);
      rows.push(['Apixaban', (crit >= 2 || cl < 30) ? '2,5 mg × 2/j <br><small>' + (cl < 30 ? 'clairance 15–29' : crit + ' critères sur 3') + '</small>' : '5 mg × 2/j <br><small>' + crit + ' critère' + (crit > 1 ? 's' : '') + ' sur 3</small>']);
      // rivaroxaban
      rows.push(['Rivaroxaban', cl < 50 ? '15 mg/j <br><small>clairance 15–49, au cours du repas</small>' : '20 mg/j <br><small>au cours du repas</small>']);
      // édoxaban
      var ed = [];
      if (cl <= 50) ed.push('clairance 15–50'); if (w <= 60) ed.push('poids ≤ 60 kg'); if (v.pgp) ed.push('inhibiteur de la glycoprotéine P');
      rows.push(['Édoxaban', ed.length ? '30 mg/j <br><small>' + ed.join(', ') + '</small>' : '60 mg/j' + (cl > 95 ? ' <br><small>clairance > 95 : efficacité moindre observée</small>' : '')]);
      // dabigatran
      var dab;
      if (cl < 30) dab = 'contre-indiqué <br><small>clairance < 30</small>';
      else if (age >= 80 || v.vera) dab = '110 mg × 2/j <br><small>' + (age >= 80 ? 'âge ≥ 80 ans' : 'vérapamil') + '</small>';
      else if (age >= 75 || cl <= 50) dab = '150 ou 110 mg × 2/j <br><small>à discuter : ' + (age >= 75 ? '75–79 ans' : 'clairance 30–50') + ', risque hémorragique</small>';
      else dab = '150 mg × 2/j';
      rows.push(['Dabigatran', dab]);
      if (cl < 30) lvl = 'mid';
      return out(lvl, fmt(cl) + ' <small>mL/min (Cockcroft-Gault)</small>', 'Doses de prévention de l’AVC dans la fibrillation atriale. Une dose réduite sans critère est délétère (III B).') + tbl(rows) +
        '<p class="c-n">Contre-indiqués : valve mécanique, rétrécissement mitral rhumatismal significatif. Vérifier les interactions (rifampicine, antiépileptiques inducteurs, antirétroviraux) dans le résumé des caractéristiques du produit.</p>';
    }
  };

  C.cockcroft = {
    title: 'Fonction rénale : Cockcroft-Gault et CKD-EPI',
    form: function (p) { return renalInputs(p); },
    calc: function (v) {
      var age = n(v.age), w = n(v.poids), cr = n(v.cr);
      if (age === null || cr === null) return out('', '—', 'Renseignez âge, créatinine et sexe (et le poids pour Cockcroft-Gault).');
      var e = ckdepi(age, cr, v.sexe), st = e >= 90 ? 'G1' : e >= 60 ? 'G2' : e >= 45 ? 'G3a' : e >= 30 ? 'G3b' : e >= 15 ? 'G4' : 'G5';
      var rows = [['CKD-EPI 2021', fmt(e) + ' mL/min/1,73 m² · stade ' + st]];
      var big, lvl;
      if (w !== null) {
        var cl = cg(age, w, cr, v.sexe);
        rows.unshift(['Cockcroft-Gault', fmt(cl) + ' mL/min']);
        big = fmt(cl) + ' <small>mL/min (Cockcroft-Gault)</small>';
        lvl = cl < 30 ? 'hi' : cl < 60 ? 'mid' : 'lo';
      } else { big = fmt(e) + ' <small>mL/min/1,73 m² (CKD-EPI)</small>'; lvl = e < 30 ? 'hi' : e < 60 ? 'mid' : 'lo'; }
      return out(lvl, big, 'Les doses des anticoagulants oraux directs et de nombreux médicaments cardiologiques sont adaptées à la clairance de Cockcroft-Gault (poids réel) ; le CKD-EPI sert à classer la maladie rénale.') + tbl(rows);
    }
  };

  C.h2fpef = {
    title: 'Score H₂FPEF (probabilité d’insuffisance cardiaque à fraction d’éjection préservée)',
    form: function (p) {
      return '<div class="c-list">' + chk(p, 'o', 'Obésité : indice de masse corporelle > 30 kg/m²', 2) +
        chk(p, 'h', 'Hypertension traitée par au moins 2 antihypertenseurs', 1) + chk(p, 'f', 'Fibrillation atriale paroxystique ou persistante', 3) +
        chk(p, 'p', 'Pression artérielle pulmonaire systolique > 35 mmHg (échocardiographie)', 1) + chk(p, 'e', 'Âge > 60 ans', 1) +
        chk(p, 'r', 'Rapport E/e′ > 9', 1) + '</div>';
    },
    calc: function (v) {
      var s = (v.o ? 2 : 0) + (v.h ? 1 : 0) + (v.f ? 3 : 0) + (v.p ? 1 : 0) + (v.e ? 1 : 0) + (v.r ? 1 : 0);
      var r = s >= 6 ? ['hi', 'Probabilité élevée (supérieure à 90 % dans la cohorte de dérivation).']
        : s >= 2 ? ['mid', 'Probabilité intermédiaire : peptides natriurétiques, échocardiographie d’effort ou cathétérisme droit à l’effort selon le contexte.']
          : ['lo', 'Probabilité faible.'];
      return out(r[0], s + ' <small>sur 9</small>', r[1]) + '<p class="c-n">Score de Reddy (2018). Les recommandations 2026 l’utilisent pour éveiller le soupçon, pas pour poser le diagnostic.</p>';
    }
  };

  C.scai = {
    title: 'Stade SCAI du choc cardiogénique',
    form: function (p) {

      box.addEventListener('change', function (e) {
        var inputs = $$('input', box), chosen = inputs.filter(function (x) { return x.checked; });
        if (cq.f === 'menu' && chosen.length > cq.n) { e.target.checked = false; chosen = inputs.filter(function (x) { return x.checked; }); toast('<b>' + cq.n + ' réponse' + (cq.n > 1 ? 's' : '') + ' au maximum</b>Décochez une proposition pour en choisir une autre.'); }
        it.ans[curKey] = chosen.map(function (x) { return +x.value; });
        $('#q-ok').disabled = !chosen.length;
      });
      $('#q-ok').addEventListener('click', function () {
        it.sc[curKey] = scoreQ(cq, it.ans[curKey] || []);
        var lastInStep = it.qi >= q.s[it.si].qs.length - 1, lastStep = it.si >= q.s.length - 1;
        if (lastInStep && lastStep) { it.fin = true; var s = itemScore(q); record(id, s); S.res.push({ id: id, s: s }); store.set('sess', S); updateDot(); }
        var y = window.scrollY; renderSession(); window.scrollTo(0, y);
        var b = $('.qq[data-key="' + curKey + '"]', views.session); if (b) b.scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
    } else if (!it.fin) {
      var lastIn = it.qi >= q.s[it.si].qs.length - 1;
      act.innerHTML = '<button class="bigbtn" id="q-next" type="button">' + (lastIn ? 'Étape suivante' : 'Question suivante') + '</button>';
      $('#q-next').addEventListener('click', function () {
        if (lastIn) { it.si++; it.qi = 0; } else it.qi++;
        renderSession();
        var b = $('.qq[data-key="' + it.si + '-' + it.qi + '"]', views.session), stp = b && b.previousElementSibling;
        (stp && stp.classList.contains('q-step') ? stp : b).scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
    } else {
      var end = S.i >= S.ids.length - 1;
      act.innerHTML = '<button class="bigbtn" id="q-item" type="button">' + (end ? 'Voir le bilan' : 'Question suivante →') + '</button>';
      $('#q-item').addEventListener('click', function () { S.i++; store.set('sess', S); it = null; renderSession(); window.scrollTo(0, 0); });
    }
    setBar('back', 'Entraînement');
  }
  function renderEnd() {
    var res = S.res, n = res.length, avg = n ? res.reduce(function (a, r) { return a + r.s; }, 0) / n : 0;
    var h = '<div class="col"><div class="endsc"><strong>' + (n ? Math.round(avg * 100) + ' %' : '—') + '</strong><span>' + (n ? plural(n, 'question') + ' · ' + res.filter(function (r) { return r.s >= 0.7; }).length + ' réussies' : 'Aucune question terminée') + '</span></div>' +
      '<ul class="res-list">' + res.map(function (r) {
        var q = Q[r.id], g = q && G[q.g], cl = r.s >= 0.7 ? 'hi' : r.s >= 0.4 ? 'mid' : 'lo';
        return '<li><b class="' + cl + '">' + Math.round(r.s * 100) + '</b><span><strong>' + esc(q.t || KIND[q.k]) + '</strong><br><span style="font-size:.82rem;color:var(--muted)">' + KIND[q.k] + ' · ' + esc(g ? g.t : '') + '</span> · <a href="#g-' + q.g + '--' + q.ch + '">fiche</a></span></li>';
      }).join('') + '</ul><div style="display:grid;gap:8px;margin-top:18px">';
    var errs = res.filter(function (r) { return r.s < 0.7; }).map(function (r) { return r.id; });
    if (errs.length) h += '<button class="bigbtn" id="e-err" type="button">Refaire les ' + plural(errs.length, 'erreur') + '</button>';
    h += '<a class="bigbtn ghost" href="#entrainement" style="text-align:center;text-decoration:none">Nouvelle session</a></div></div>';
    views.session.innerHTML = h;
    var b = $('#e-err'); if (b) b.addEventListener('click', function () { startSession(shuffle(errs)); });
    store.set('sess', null);
    setBar('back', 'Bilan');
  }

  // ---------- routage ----------
  $('#back').addEventListener('click', function (e) {
    e.preventDefault();
    if (current.view === 'calc') location.hash = '#outils';
    else if (current.view === 'session') location.hash = '#entrainement';
    else if (current.view === 'doc' && doc && doc.kind === 'outil' && listView !== 'search') location.hash = '#outils';
    else location.hash = { search: '#recherche', tools: '#outils', train: '#entrainement' }[listView] || '#accueil';
  });
  function route() {
    $('#toast').hidden = true;
    var h = decodeURIComponent(location.hash.slice(1)), m;
    if ((m = /^(g|outil)-(.+)$/.exec(h))) {
      var parts = m[2].split('--'), kind = m[1], id = parts[0];
      if ((kind === 'g' && G[id]) || (kind === 'outil' && O[id])) {
        if (!doc || doc.kind !== kind || doc.id !== id || current.view !== 'doc') renderDoc(kind, id);
        showView('doc', kind === 'outil' && listView === 'tools' ? 'tools' : undefined);
        var term = lastTerm; lastTerm = '';
        openPane(parts[1], term);
        return;
      }
    }
    if ((m = /^calc-(.+)$/.exec(h)) && window.CALCS[m[1]]) { renderCalc(m[1]); showView('calc'); setBar('back', 'Calculateur'); window.scrollTo(0, 0); return; }
    if (h === 'session') { showView('session'); renderSession(); return; }
    if (h === 'entrainement') { listView = 'train'; renderTrain(); showView('train'); setBar('top'); window.scrollTo(0, 0); return; }
    if (h === 'recherche') { listView = 'search'; renderSearch(); showView('search'); setBar('top'); window.scrollTo(0, 0); setTimeout(function () { var q = $('#q'); if (q && !q.value) q.focus(); }, 60); return; }
    if (h === 'outils') { listView = 'tools'; renderTools(); showView('tools'); setBar('top'); window.scrollTo(0, 0); return; }
    listView = 'home'; renderHome(); showView('home'); setBar('top'); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  updateDot();
  route();
};

/* ===================================================================
   Verrou : le contenu (data/content.json) est chiffré en AES-256-GCM,
   clé dérivée du mot de passe (PBKDF2-SHA256), puis gardée sur le téléphone.
   =================================================================== */
(function () {
  var b64d = function (t) { var s = atob(t), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  var b64e = function (buf) { var a = new Uint8Array(buf), t = ''; for (var i = 0; i < a.length; i++) t += String.fromCharCode(a[i]); return btoa(t); };
  var KEYNAME = 'rc:key', DATA = null;
  function lsGet() { try { return JSON.parse(localStorage.getItem(KEYNAME)); } catch (e) { return null; } }
  function lsSet(v) { try { localStorage.setItem(KEYNAME, JSON.stringify(v)); } catch (e) {} }
  window.lockApp = function () { try { localStorage.removeItem(KEYNAME); } catch (e) {} location.replace(location.pathname); };
  function derive(pw, kdf) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(kdf.salt), iterations: kdf.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function decrypt(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(DATA.iv) }, key, b64d(DATA.ct)).then(function (buf) { return new TextDecoder().decode(buf); }); }
  function mount(txt) {
    var data = JSON.parse(txt);
    document.body.classList.remove('locked');
    document.getElementById('lockscreen').hidden = true;
    window.initApp(data);
  }
  function showLock(msg) {
    document.body.classList.add('locked');
    document.getElementById('lockscreen').hidden = false;
    var err = document.getElementById('lock-err'); err.hidden = !msg; err.textContent = msg || '';
  }
  var form = document.getElementById('unlock'), btn = document.getElementById('unlock-btn');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value.trim();
    if (!pw || !DATA) return;
    btn.disabled = true; btn.textContent = 'Ouverture…';
    derive(pw, DATA.kdf).then(function (key) {
      return decrypt(key).then(function (txt) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) { lsSet({ salt: DATA.kdf.salt, k: b64e(raw) }); mount(txt); });
      });
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Ouvrir';
      showLock('Mot de passe incorrect. Vérifiez les tirets et les minuscules.');
    });
  });
  document.body.classList.add('locked');
  fetch('data/content.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    DATA = d;
    var st = lsGet();
    if (!st || st.salt !== d.kdf.salt) return showLock();
    return crypto.subtle.importKey('raw', b64d(st.k), { name: 'AES-GCM' }, true, ['decrypt']).then(decrypt).then(mount).catch(function () { showLock(); });
  }).catch(function () { showLock('Impossible de charger le contenu. Vérifiez la connexion et rouvrez l’appli.'); });
})();
</script>
